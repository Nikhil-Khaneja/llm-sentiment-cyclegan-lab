# QUICK PILOT — same networks as cyclegan_nikhil.yaml, smaller data (300 Monet, 1.5k photos) and 10 epochs.
run_name: quick_cyclegan_nikhil
seed: 7
device: auto
write_metrics_report: false
log_every: 200

data:
  root: task3_gan/data/pilot_monet2photo   # PILOT ONLY: public monet2photo (download_pilot_monet2photo.py), NOT the Kaggle data
  monet_dir: monet_jpg       # domain A
  photo_dir: photo_jpg       # domain B
  image_size: 128            # training crop
  load_size: 143             # resize before random crop (same 1.12 ratio as 286 -> 256 in the paper)
  monet_holdout: 0           # only ~300 Monets: all used for training; Monet->Photo eval uses them too
  photo_holdout: 500
  epoch_size: null           # null = size of the larger training domain (photos)
  max_images: null
  max_monet: 300            # match the Kaggle set size (~300 Monets)
  max_photo: 2000           # 1,500 train + 500 held out

model:
  ngf: 64                    # generator base channels
  n_blocks: 6                # residual blocks
  ndf: 64                    # discriminator base channels

train:
  batch_size: 2
  num_workers: 4
  lr: 2.0e-4
  betas: [0.5, 0.999]
  epochs_constant: 5
  epochs_decay: 5            # 10 epochs total
  lambda_cycle: 10
  lambda_identity: 5
  pool_size: 50              # history of generated images shown to the discriminators
  checkpoint_every: 2

eval:
  batch_size: 32
  kid_subset_size: 300
  prdc_k: 5
  audit_samples: 30
  save_predictions: true     # -> outputs/pred_A2B, outputs/pred_B2A
  make_submission: false     # pilot run: not for Kaggle

submission:                  # Photo -> Monet on ALL photos, direct generator output
  infer_size: 256            # the generator is fully convolutional; run it at Kaggle resolution
  output_size: 256
  zip_name: images.zip
