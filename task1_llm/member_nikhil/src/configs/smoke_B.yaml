# SMOKE TEST — same model as gpt_nikhil.yaml on a tiny subset, 1 epoch (~1 min).
run_name: smoke_gpt_nikhil_B
seed: 1337
device: auto            # auto = cuda > mps > cpu
write_metrics_report: false

data:
  raw_path: task1_llm/data/tinystories_raw.txt   # from task1_llm/data/download_tinystories.py
  processed_dir: data_processed/smoke
  block_size: 128        # characters of context
  n_train: 2000
  n_val: 200
  val_story_frac: 0.1    # stories held out for validation before chunking

model:
  d_model: 256
  n_heads: 8             # head_dim = 32
  n_layers: 2
  d_ff: 1024
  dropout: 0.10

train:
  batch_size: 64
  eval_batch_size: 256
  epochs: 1
  lr: 3.0e-4
  min_lr: 1.0e-5
  warmup_steps: 10
  weight_decay: 0.01
  grad_clip: 1.0
  spike_ratio: 1.3
  log_every: 10

generate:
  max_new_tokens: 60
  temperature: 0.9
  samples_per_prompt: 1
  prompts:
    - "Once upon a time, there was a little girl named"
    - "Tom and his dog went to the park. "
    - "One day, a big bear"
    - "The sun was hot and"
    - "Lily wanted to"
